<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube RAG</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>YouTube RAG Chatbot</h1>

        <div class="card">

            <label for="video">Video ID</label>

            <input
                type="text"
                id="video"
                name="video"
                placeholder="Enter YouTube Video ID">

            <button id="load-btn" type="button">
                Load Video
            </button>

            <label for="language">Transcript Language</label>

            <select id="language" name="language">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
            </select>

            <p id="status"></p>

            <label for="question">Question</label>

            <textarea
                id="question"
                name="question"
                rows="5"
                placeholder="Ask anything about the video"></textarea>

            <button id="ask-btn" type="button">
                Ask
            </button>

        </div>

        <div class="chat-card">

            <div id="chat-box">

            </div>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
